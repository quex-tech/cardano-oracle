name: on-chain
on: [push, pull_request]

jobs:
  build-and-test:
    # ubuntu-latest is x86_64, so the x86_64-linux devx image inside
    # compile-contracts.sh runs natively (no emulation).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reuse the canonical build entrypoint: it runs `docker run ... bash -ic`,
      # so the devx Nix env (ghc/cabal on PATH, loaded via /root/.bashrc) is
      # active, then runs cabal test + both blueprint generators.
      - run: ./compile-contracts.sh
