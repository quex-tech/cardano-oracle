[project]
name = "quex-cardano-oracle"
version = "0.1.0"
description = "Quex Cardano Oracle off-chain scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.7.0",
    "asn1crypto==1.5.1",
    "attrs==25.4.0",
    "blockfrost-python==0.6.0",
    "cachetools==6.2.1",
    "cardano-tools==2.1.0",
    "cbor2==5.7.1",
    "certifi==2025.10.5",
    "certvalidator==0.11.1",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "coloredlogs==15.0.1",
    "cose==0.9.dev8",
    "cryptography==46.0.3",
    "cytoolz==1.1.0",
    "docker==7.1.0",
    "dotenv==0.9.9",
    "ecdsa==0.19.1",
    "ecpy==1.2.5",
    "eth-hash==0.7.1",
    "eth-keys==0.7.0",
    "eth-typing==5.2.1",
    "eth-utils==5.3.1",
    "frozendict==2.4.6",
    "frozenlist==1.8.0",
    "humanfriendly==10.0",
    "idna==3.11",
    "mnemonic==0.21",
    "ogmios==1.4.3",
    "orjson==3.11.4",
    "oscrypto==1.3.0",
    "pexpect==4.9.0",
    "pprintpp==0.4.0",
    "ptyprocess==0.7.0",
    "pycardano==0.17.0",
    "pycparser==2.23",
    "pydantic==2.12.4",
    "pydantic-core==2.41.5",
    "pynacl==1.6.1",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "setuptools==80.9.0",
    "six==1.17.0",
    "toolz==1.1.0",
    "typeguard==4.4.4",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.5.0",
    "websocket-client==1.9.0",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
    "ty>=0.0.1a32",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T100",
    "TC",
    "TD",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ANN205",
    "ANN206",
    "ANN401",
    "COM812",
    "PLR0913",
    "PLR0914",
    "PLR0917",
    "UP006",
    "UP035",
]
preview = true
